<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment Confirmed</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 8px; overflow: hidden; }
        .header { background: #007bff; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .footer { background: #f8f9fa; padding: 15px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Appointment Confirmed</h1>
    </div>
    <div class="content">
        <p>Hi <strong th:text="${user.name}">User</strong>,</p>
        <p>Your appointment has been successfully booked:</p>
        <ul>
            <li><strong>Doctor:</strong> <span th:text="${appointment.doctor.name}"></span></li>
            <li><strong>Date:</strong> <span th:text="${#dates.format(appointment.date, 'dd MMM yyyy')}"></span></li>
            <li><strong>Time:</strong> <span th:text="${appointment.time}"></span></li>
        </ul>
        <p>We look forward to seeing you!</p>
    </div>
    <div class="footer">
        &copy; 2025 Docease. All rights reserved.<br>
        Need help? Contact <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}"></a>
    </div>
</div>
</body>
</html>
